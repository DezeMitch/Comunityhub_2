services:
  postgres:
    image: postgres:16-alpine
    container_name: communityhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: communityhub
      POSTGRES_PASSWORD: communityhub
      POSTGRES_DB: communityhub
    ports:
      - "5432:5432"
    volumes:
      - communityhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U communityhub -d communityhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: communityhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - communityhub_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  communityhub_pg:
  communityhub_redis:
